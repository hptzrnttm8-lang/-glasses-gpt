name: Build zsign for iSH

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-zsign-ish.yml"

jobs:
  build-zsign-ish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build iSH-compatible zsign
        run: |
          set -euxo pipefail
          rm -rf out
          mkdir -p out

          docker run --rm --platform linux/386             -v "$PWD/out:/out"             alpine:3.14 sh -lc '
              set -eux

              apk add --no-cache                 build-base                 pkgconf                 openssl-dev                 zlib-dev                 wget                 tar                 sed                 findutils                 file

              cd /tmp
              wget -O zsign.tar.gz                 https://github.com/zhlynn/zsign/archive/refs/tags/v1.1.2.tar.gz
              tar xzf zsign.tar.gz

              ROOT="$(find /tmp -maxdepth 6 -type f -path "*/build/linux/Makefile" -print | head -n1 | sed "s#/build/linux/Makefile##")"
              test -n "$ROOT"
              echo "Using source root: $ROOT"

              CERTCHECK="$ROOT/src/certcheck.cpp"
              OPENSSLCPP="$ROOT/src/openssl.cpp"
              test -f "$CERTCHECK"
              test -f "$OPENSSLCPP"

              # zsign 1.1.2 contains OpenSSL 3 provider API calls.
              # iSH Alpine 3.14 ships OpenSSL 1.1.1, so strip only those
              # optional provider references.
              sed -i "/openssl\/provider.h/d" "$CERTCHECK"
              sed -i "/openssl\/provider.h/d" "$OPENSSLCPP"
              sed -i "/OSSL_PROVIDER_load/d" "$CERTCHECK"
              sed -i "/OSSL_PROVIDER_load/d" "$OPENSSLCPP"

              # Verify the OpenSSL 3-only symbols are gone before compiling.
              ! grep -R "openssl/provider.h\|OSSL_PROVIDER_load" "$ROOT/src"

              cd "$ROOT/build/linux"
              make clean || true
              make VERSION=1.1.2                 CXXFLAGS="-std=c++11 -O2 -Wno-unused-result -MMD -MP -fpermissive"

              test -x "$ROOT/bin/zsign"
              cp "$ROOT/bin/zsign" /out/zsign
              chmod +x /out/zsign

              echo "Built binary:"
              file /out/zsign
              ldd /out/zsign || true
              /out/zsign -v || true
            '

      - name: Package artifact
        run: |
          test -x out/zsign
          tar czf zsign-ish-alpine-x86.tar.gz -C out zsign

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zsign-ish-alpine-x86
          path: zsign-ish-alpine-x86.tar.gz
          retention-days: 7
