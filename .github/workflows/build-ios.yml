name: Build unsigned iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project GlassesGPT.xcodeproj -scheme GlassesGPT

      - name: Build for physical iPhone without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project GlassesGPT.xcodeproj \
            -scheme GlassesGPT \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP="$(find "$PWD/build/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry GlassesGPT-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GlassesGPT-unsigned-ipa
          path: GlassesGPT-unsigned.ipa
