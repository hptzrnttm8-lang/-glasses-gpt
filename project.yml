name: GlassesGPT

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.2"

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: 1.0.0

targets:
  GlassesGPT:
    type: application
    platform: iOS
    sources:
      - path: ios
        excludes:
          - Info.plist.snippet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GlassesGPT
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: ios/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
