name: GlassesGPT

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.2"

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: 1.0.0

targets:
  GlassesGPT:
    type: application
    platform: iOS
    sources:
      - path: ios
        excludes:
          - Info.plist.snippet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GlassesGPT
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GlassesGPT
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Connect to Meta AI glasses.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Use speech from Meta AI glasses for hands-free questions.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to Meta AI glasses over the local network.
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATSpeech
